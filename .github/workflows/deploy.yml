name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: subscription_tracker_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Security Vulnerability Audit (Composer)
        run: composer audit --locked

      - name: Check Code Formatting (Pint)
        run: vendor/bin/pint --test

      - name: Static Analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Execute Tests (PHPUnit)
        run: php artisan test --compact

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: subscription_tracker_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup E2E Environment & Database
        run: |
          cp .env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8011|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=subscription_tracker_test|' .env
          php artisan key:generate
          php artisan migrate --force

      - name: Install Playwright Chromium
        run: |
          npm --prefix e2e ci
          npx --prefix e2e playwright install --with-deps chromium

      - name: Run Playwright Browser E2E Tests
        run: |
          php artisan serve --host=127.0.0.1 --port=8011 > /tmp/laravel-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8011/up > /dev/null; then
              break
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:8011 npm --prefix e2e test

  deploy:
    name: Deploy to Azure VM
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            export HOME=/root
            cd /var/www/subscription-tracker
            trap 'php artisan up || true' EXIT
            php artisan down --refresh=5 || true
            git config --system --add safe.directory '*'
            git fetch origin main
            git reset --hard origin/main
            rm -rf /var/www/subscription-tracker/public/build
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan fx:refresh --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
            (crontab -l 2>/dev/null | grep -F "schedule:run") || (crontab -l 2>/dev/null; echo "* * * * * cd /var/www/subscription-tracker && php artisan schedule:run >> /dev/null 2>&1") | crontab -
            chown -R www-data:www-data /var/www/subscription-tracker
            chmod -R 775 storage bootstrap/cache
            php artisan up
            echo "Deployment to mysubshield.me completed successfully."
