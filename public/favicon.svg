<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="ssShieldBg" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="ssBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Ribbon Top (Cyan to Indigo) -->
    <linearGradient id="ssRibbonTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Ribbon Bottom (Violet to Cyan) -->
    <linearGradient id="ssRibbonBottom" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="ssCoreGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="ssGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Hex-Shield Body -->
  <path d="M 32 3.5
           C 47 3.5, 57.5 9.5, 57.5 22.5
           C 57.5 41, 43.5 53.5, 32 60.5
           C 20.5 53.5, 6.5 41, 6.5 22.5
           C 6.5 9.5, 17 3.5, 32 3.5 Z"
        fill="url(#ssShieldBg)"
        stroke="url(#ssBorderGlow)"
        stroke-width="1.75" />

  <!-- 2. Subtle Shield Top-Left Highlight Glass Facet -->
  <path d="M 32 5
           C 45 5, 55 10.5, 55.5 22
           C 52 14, 42 7.5, 32 7.5
           C 22 7.5, 12 14, 8.5 22
           C 9 10.5, 19 5, 32 5 Z"
        fill="white"
        opacity="0.08" />

  <!-- 3. Ambient Central Pulse Glow -->
  <circle cx="32" cy="31" r="18" fill="url(#ssCoreGlow)" />

  <!-- 4. The Interlocking Subscription Ribbon (Forms stylized 'S' + Recurring Cycle) -->

  <!-- Top Loop: starts center-left, curves over top right, sweeps down into spine -->
  <path d="M 23 29
           C 23 21, 28 15, 37 15
           C 43.5 15, 47 18.5, 47 23.5
           C 47 28.5, 42 30.5, 35 32
           C 27.5 33.5, 18 36, 18 43
           C 18 45.5, 19.5 48, 22 50
           C 18.5 45.5, 19.5 39, 27 37
           C 34.5 35, 43 33, 44 26
           C 44.5 20, 39 17.5, 35 17.5
           C 28 17.5, 25 22, 25 27
           Z"
        fill="url(#ssRibbonTop)"
        filter="url(#ssGlow)" />

  <!-- Bottom Loop: flows from bottom-right, curves around bottom-left, locks through spine -->
  <path d="M 41 33
           C 41 41, 36 47, 27 47
           C 20.5 47, 17 43.5, 17 38.5
           C 17 33.5, 22 31.5, 29 30
           C 36.5 28.5, 46 26, 46 19
           C 46 16.5, 44.5 14, 42 12
           C 45.5 16.5, 44.5 23, 37 25
           C 29.5 27, 21 29, 20 36
           C 19.5 42, 25 44.5, 29 44.5
           C 36 44.5, 39 40, 39 35
           Z"
        fill="url(#ssRibbonBottom)"
        opacity="0.9" />

  <!-- 5. Central Currency & Security Nexus (Gleaming diamond star node) -->
  <g transform="translate(32, 31)">
    <!-- Rotating recurring cycle ring points -->
    <circle cx="0" cy="0" r="3.2" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.5" fill="#4338ca" />

    <!-- Renewal Spark rays -->
    <path d="M 0 -7 L 1.2 -2.5 L 6 0 L 1.2 2.5 L 0 7 L -1.2 2.5 L -6 0 L -1.2 -2.5 Z"
          fill="#38bdf8"
          opacity="0.85" />
  </g>
</svg>
