<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Shield body -->
  <path d="M32 4 L56 14 L56 34 C56 46 44 56 32 60 C20 56 8 46 8 34 L8 14 Z"
        fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Inner shield highlight -->
  <path d="M32 10 L50 18 L50 34 C50 43 41 51 32 54.5 C23 51 14 43 14 34 L14 18 Z"
        fill="url(#innerGrad)" opacity="0.4"/>

  <!-- Currency/credit card icon inside shield -->
  <rect x="21" y="26" width="22" height="15" rx="2.5" fill="white" opacity="0.95"/>
  <rect x="21" y="30" width="22" height="3.5" fill="url(#cardGrad)" opacity="0.9"/>
  <circle cx="26.5" cy="37" r="2" fill="url(#shieldGrad)" opacity="0.8"/>
  <rect x="30" y="35.5" width="10" height="1.5" rx="0.75" fill="url(#shieldGrad)" opacity="0.5"/>
  <rect x="30" y="38" width="6" height="1.5" rx="0.75" fill="url(#shieldGrad)" opacity="0.5"/>

  <!-- S letterform at top of shield -->
  <text x="32" y="26" font-family="Arial Black, sans-serif" font-size="9" font-weight="900"
        fill="white" text-anchor="middle" opacity="0.9">S</text>

  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
</svg>
