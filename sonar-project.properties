sonar.projectKey=osman-builds_digital-subscription-tracker
sonar.organization=osman-builds

# Source and Test paths
sonar.sources=app,bootstrap,config,database,public,resources,routes
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**
sonar.cpd.exclusions=tests/**

# Suppress false positives for test code
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
